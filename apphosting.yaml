# Firebase App Hosting configuration
# https://firebase.google.com/docs/app-hosting/configure
#
# Public Firebase Web SDK values (NEXT_PUBLIC_FIREBASE_*) and
# ADMIN_NOTIFICATION_EMAILS are set in the Firebase Console under
#   App Hosting → jtpa-main → Settings → Environment variables
# (kept out of git on purpose — they end up in the client bundle either
# way, but at least the source code repo stays free of identifiers).
#
# Secrets stored in Google Secret Manager and referenced via `secret:`:
#   firebase apphosting:secrets:set SESSION_COOKIE_SECRET
#   firebase apphosting:secrets:grantaccess SESSION_COOKIE_SECRET --backend jtpa-main

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: SESSION_COOKIE_SECRET
    secret: SESSION_COOKIE_SECRET
    availability:
      - RUNTIME
