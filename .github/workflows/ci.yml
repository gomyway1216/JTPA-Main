name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    env:
      NPM_VERSION: 11.16.0
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Pin npm
        run: |
          npm install -g npm@${NPM_VERSION}
          npm --version

      - name: Install dependencies
        run: npm ci

      # Audit production dependencies only. `firebase-tools` (a devDependency
      # used solely to run the emulator-backed rules tests) drags in CLI-only
      # transitive advisories — e.g. tar path-traversal — that never reach the
      # deployed app. `--omit=dev` keeps the high-severity gate focused on the
      # runtime surface while still failing on real production vulnerabilities.
      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Check i18n catalogs
        run: npm run check:i18n

      - name: Test
        # --coverage enforces the ratchet thresholds in vitest.config.mts,
        # failing the job if coverage regresses below the floors.
        run: npm test -- --coverage

      - name: Build
        env:
          # next build reads NEXT_PUBLIC_* at build time; provide placeholders
          # so the build doesn't fail on missing client-side Firebase config.
          # These are NOT secrets — actual values are injected at deploy time.
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder
        run: npm run build

  rules-tests:
    name: Security Rules Tests
    runs-on: ubuntu-latest
    env:
      NPM_VERSION: 11.16.0
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      # The Firestore emulator runs on the JVM.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pin npm
        run: |
          npm install -g npm@${NPM_VERSION}
          npm --version

      # Installs `firebase-tools` (a pinned devDependency) too, so `npm run
      # test:rules` finds the local `firebase` binary on PATH — no separate
      # global install is needed.
      - name: Install dependencies
        run: npm ci

      - name: Firestore & Storage rules tests
        run: npm run test:rules
