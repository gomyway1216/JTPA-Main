name: Deploy Firestore & Storage Rules

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "firebase.json"
      - ".github/workflows/deploy-rules.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NPM_VERSION: 11.16.0
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      - name: Pin npm
        run: |
          npm install -g npm@${NPM_VERSION}
          npm --version

      # Exports GOOGLE_APPLICATION_CREDENTIALS for subsequent steps so the
      # Firebase CLI picks up the service-account credentials automatically.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Deploy rules and indexes
        run: firebase deploy --only firestore,storage --project jtpa-main --non-interactive
