name: Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tracked-files:
    name: Scan tracked files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for secrets
        shell: bash
        run: |
          python3 <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          patterns = [
              ("PEM private key", re.compile(rb"-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----")),
              ("GitHub token", re.compile(rb"gh[pousr]_[A-Za-z0-9_]{36,}")),
              ("OpenAI API key", re.compile(rb"sk-(?!ant-)(?:proj-|svcacct-)?[A-Za-z0-9_-]{20,}")),
              ("Anthropic API key", re.compile(rb"sk-ant-[A-Za-z0-9_-]{20,}")),
              ("Firebase/Google API key", re.compile(rb"AIza[0-9A-Za-z_-]{35}")),
          ]

          files = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          findings = []

          for raw_path in files:
              if not raw_path:
                  continue
              path = pathlib.Path(raw_path.decode("utf-8", errors="replace"))
              try:
                  data = path.read_bytes()
              except OSError as exc:
                  findings.append((str(path), 1, "Read error", str(exc)))
                  continue

              for label, pattern in patterns:
                  for match in pattern.finditer(data):
                      line = data.count(b"\n", 0, match.start()) + 1
                      findings.append((str(path), line, label, "potential secret in tracked file"))

          for path, line, label, message in findings:
              print(f"::error file={path},line={line},title={label}::{message}")

          if findings:
              print(f"Secret scan failed with {len(findings)} finding(s).")
              sys.exit(1)

          print("Secret scan passed.")
          PY
